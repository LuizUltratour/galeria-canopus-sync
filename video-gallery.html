<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Vídeos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #FFFFFF;
      --dark:         #000000;
      --border:       rgba(0,0,0,0.10);
      --border-strong:rgba(0,0,0,0.22);
      --font-sans:    'Inter', system-ui, sans-serif;
      --ease:         cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--dark);
      font-family: var(--font-sans);
    }

    /* ── ROOT ── */
    #vg-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
    }

    /* ── HEADER ── */
    #vg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #vg-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.4;
    }

    #btn-close {
      width: 38px; height: 38px;
      border: 1px solid var(--border-strong);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      color: var(--dark);
      transition: background 0.25s var(--ease), color 0.25s var(--ease);
    }
    #btn-close:hover { background: var(--dark); color: var(--bg); border-color: var(--dark); }

    /* ── PLAYER — fills the entire area below the header ── */
    #vg-player-wrap {
      flex: 1;
      min-height: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #vg-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      outline: none;
    }

    /* mobile */
    @media (max-width: 600px) {
      #vg-header { padding: 10px 14px; }
    }
  </style>
</head>
<body>

<div id="vg-root">
  <header id="vg-header">
    <span id="vg-title">Galeria de Vídeos</span>
    <button id="btn-close" title="Fechar" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </header>
  <div id="vg-player-wrap">
    <video id="vg-player" src="assets/videos/FILME_CANOPUS_SYNC.mp4" autoplay muted playsinline controls></video>
  </div>
</div>

<script>
document.getElementById('btn-close').addEventListener('click', closeGallery);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeGallery();
});

function closeGallery() {
  if (window.parent !== window) {
    window.parent.postMessage({ action: 'closeGallery' }, '*');
  }
}
</script>
</body>
</html>
